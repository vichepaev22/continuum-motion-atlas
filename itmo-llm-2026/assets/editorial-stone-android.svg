<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 550" role="img" aria-labelledby="t d">
<title id="t">Каменный андроид — искусственный интеллект как новая скульптура мысли</title>
<desc id="d">Античный бюст андроида из светлого мрамора с механическими суставами, фиолетовым нимбом и тонкими линиями данных.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0d0d21"/><stop offset=".52" stop-color="#28203f"/><stop offset="1" stop-color="#533365"/></linearGradient>
  <radialGradient id="aura"><stop stop-color="#b899ff" stop-opacity=".65"/><stop offset=".38" stop-color="#7c59d9" stop-opacity=".24"/><stop offset="1" stop-color="#6b51b7" stop-opacity="0"/></radialGradient>
  <linearGradient id="marble" x1=".05" y1=".02" x2=".9" y2="1"><stop stop-color="#fffaf1"/><stop offset=".33" stop-color="#c8c2d2"/><stop offset=".65" stop-color="#8e91a9"/><stop offset="1" stop-color="#5c536d"/></linearGradient>
  <linearGradient id="front" x1="0" y1="0" x2=".9" y2="1"><stop stop-color="#f1e9ed"/><stop offset=".58" stop-color="#b2acc6"/><stop offset="1" stop-color="#797188"/></linearGradient>
  <linearGradient id="shadow" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#62546f"/><stop offset=".45" stop-color="#302a45"/><stop offset="1" stop-color="#16152c"/></linearGradient>
  <linearGradient id="metal" x1="0" x2="1"><stop stop-color="#aea8ba"/><stop offset=".45" stop-color="#333046"/><stop offset="1" stop-color="#857d98"/></linearGradient>
  <linearGradient id="glow" x1="0" x2="1"><stop stop-color="#dbc6ff"/><stop offset="1" stop-color="#9872ff"/></linearGradient>
  <filter id="grain" x="-20%" y="-20%" width="140%" height="140%"><feTurbulence type="fractalNoise" baseFrequency=".19" numOctaves="3" seed="8" result="noise"/><feColorMatrix in="noise" type="saturate" values="0" result="mono"/><feComponentTransfer in="mono" result="alpha"><feFuncA type="linear" slope=".085"/></feComponentTransfer><feBlend in="SourceGraphic" in2="alpha" mode="multiply"/></filter>
  <filter id="bloom" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="6"/></filter>
  <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse"><circle cx="17" cy="17" r="1.4" fill="#ccb0ff" opacity=".28"/></pattern>
</defs>
