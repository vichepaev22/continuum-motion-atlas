name: ITMO digital edition — browser QA
on:
  push:
    paths:
      - 'itmo-llm-2026/**'
      - '.github/workflows/itmo-magazine-e2e.yml'
  pull_request:
    paths:
      - 'itmo-llm-2026/**'
      - '.github/workflows/itmo-magazine-e2e.yml'
  workflow_dispatch:
jobs:
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: itmo-llm-2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test desktop and mobile
        run: npm run test:e2e
